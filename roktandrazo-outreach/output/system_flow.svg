<svg viewBox="0 0 680 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" font-size="16" font-weight="500" fill="#2C2C2A">Roktandrazo BD 自动化采集系统流程</text>
  
  <!-- Phase 1: Auto Collection -->
  <rect x="40" y="60" width="600" height="180" rx="12" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="60" y="85" font-size="14" font-weight="500" fill="#0C447C">阶段 1：自动采集（全自动）</text>
  
  <!-- City Selection -->
  <rect x="60" y="100" width="140" height="50" rx="8" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
  <text x="130" y="125" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">城市选择</text>
  <text x="130" y="140" text-anchor="middle" font-size="11" fill="#185FA5">按策略自动选择</text>
  
  <!-- Search -->
  <rect x="230" y="100" width="140" height="50" rx="8" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
  <text x="300" y="125" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">关键词搜索</text>
  <text x="300" y="140" text-anchor="middle" font-size="11" fill="#185FA5">WebSearch + 官网验证</text>
  
  <!-- Website Verify -->
  <rect x="400" y="100" width="140" height="50" rx="8" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
  <text x="470" y="125" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">官网验证</text>
  <text x="470" y="140" text-anchor="middle" font-size="11" fill="#185FA5">确认官网存在</text>
  
  <!-- Extract Info -->
  <rect x="60" y="170" width="140" height="50" rx="8" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
  <text x="130" y="195" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">联系信息提取</text>
  <text x="130" y="210" text-anchor="middle" font-size="11" fill="#185FA5">邮箱/表单/wholesale页</text>
  
  <!-- Evidence Save -->
  <rect x="230" y="170" width="140" height="50" rx="8" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
  <text x="300" y="195" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">证据保存</text>
  <text x="300" y="210" text-anchor="middle" font-size="11" fill="#185FA5">evidence_url 记录</text>
  
  <!-- Auto Score -->
  <rect x="400" y="170" width="140" height="50" rx="8" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
  <text x="470" y="195" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">自动评分</text>
  <text x="470" y="210" text-anchor="middle" font-size="11" fill="#185FA5">A/B/C 自动分级</text>
  
  <!-- Arrows Phase 1 -->
  <path d="M200 125 L230 125" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M370 125 L400 125" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M470 150 L470 170" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M400 195 L200 195" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M200 195 L200 195" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Phase 2: Human Review -->
  <rect x="40" y="260" width="600" height="120" rx="12" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text x="60" y="285" font-size="14" font-weight="500" fill="#27500A">阶段 2：人工审核（最小化）</text>
  
  <!-- Review Queue -->
  <rect x="60" y="300" width="180" height="60" rx="8" fill="#C0DD97" stroke="#639922" stroke-width="0.5"/>
  <text x="150" y="325" text-anchor="middle" font-size="13" font-weight="500" fill="#27500A">审核队列</text>
  <text x="150" y="345" text-anchor="middle" font-size="11" fill="#3B6D11">A/B级线索质量确认</text>
  
  <!-- Approve -->
  <rect x="280" y="300" width="160" height="60" rx="8" fill="#C0DD97" stroke="#639922" stroke-width="0.5"/>
  <text x="360" y="325" text-anchor="middle" font-size="13" font-weight="500" fill="#27500A">批准发送</text>
  <text x="360" y="345" text-anchor="middle" font-size="11" fill="#3B6D11">确认 dry-run 批次</text>
  
  <!-- Dry Run -->
  <rect x="480" y="300" width="140" height="60" rx="8" fill="#C0DD97" stroke="#639922" stroke-width="0.5"/>
  <text x="550" y="325" text-anchor="middle" font-size="13" font-weight="500" fill="#27500A">Dry-run 预览</text>
  <text x="550" y="345" text-anchor="middle" font-size="11" fill="#3B6D11">内容/收件人确认</text>
  
  <!-- Arrows Phase 2 -->
  <path d="M240 330 L280 330" fill="none" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M440 330 L480 330" fill="none" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Phase 3: Sending -->
  <rect x="40" y="400" width="600" height="120" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="60" y="425" font-size="14" font-weight="500" fill="#633806">阶段 3：自动发送（小批量）</text>
  
  <!-- Send Queue -->
  <rect x="60" y="440" width="140" height="60" rx="8" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
  <text x="130" y="465" text-anchor="middle" font-size="13" font-weight="500" fill="#633806">发送队列</text>
  <text x="130" y="485" text-anchor="middle" font-size="11" fill="#854F0B">approved 线索</text>
  
  <!-- SMTP Send -->
  <rect x="230" y="440" width="140" height="60" rx="8" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
  <text x="300" y="465" text-anchor="middle" font-size="13" font-weight="500" fill="#633806">SMTP 发送</text>
  <text x="300" y="485" text-anchor="middle" font-size="11" fill="#854F0B">腾讯企业邮箱</text>
  
  <!-- Status Update -->
  <rect x="400" y="440" width="140" height="60" rx="8" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
  <text x="470" y="465" text-anchor="middle" font-size="13" font-weight="500" fill="#633806">状态更新</text>
  <text x="470" y="485" text-anchor="middle" font-size="11" fill="#854F0B">sent/failed 记录</text>
  
  <!-- Arrows Phase 3 -->
  <path d="M200 470 L230 470" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M370 470 L400 470" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Phase 4: Closed Loop -->
  <rect x="40" y="540" width="600" height="120" rx="12" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
  <text x="60" y="565" font-size="14" font-weight="500" fill="#791F1F">阶段 4：闭环监控（自动）</text>
  
  <!-- Response Monitor -->
  <rect x="60" y="580" width="140" height="60" rx="8" fill="#F7C1C1" stroke="#E24B4A" stroke-width="0.5"/>
  <text x="130" y="605" text-anchor="middle" font-size="13" font-weight="500" fill="#791F1F">回复监控</text>
  <text x="130" y="625" text-anchor="middle" font-size="11" fill="#A32D2D">IMAP 检测回复</text>
  
  <!-- Bounce Detect -->
  <rect x="230" y="580" width="140" height="60" rx="8" fill="#F7C1C1" stroke="#E24B4A" stroke-width="0.5"/>
  <text x="300" y="605" text-anchor="middle" font-size="13" font-weight="500" fill="#791F1F">退信检测</text>
  <text x="300" y="625" text-anchor="middle" font-size="11" fill="#A32D2D">自动加入 suppression</text>
  
  <!-- Unsubscribe -->
  <rect x="400" y="580" width="140" height="60" rx="8" fill="#F7C1C1" stroke="#E24B4A" stroke-width="0.5"/>
  <text x="470" y="605" text-anchor="middle" font-size="13" font-weight="500" fill="#791F1F">退订处理</text>
  <text x="470" y="625" text-anchor="middle" font-size="11" fill="#A32D2D">do_not_contact</text>
  
  <!-- Arrows Phase 4 -->
  <path d="M200 610 L230 610" fill="none" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M370 610 L400 610" fill="none" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Phase 5: Reporting -->
  <rect x="40" y="680" width="600" height="100" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="60" y="705" font-size="14" font-weight="500" fill="#3C3489">阶段 5：周报输出（自动）</text>
  
  <!-- Weekly Report -->
  <rect x="60" y="720" width="180" height="40" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="150" y="745" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">采集数/可发数/发送数</text>
  
  <!-- Metrics -->
  <rect x="280" y="720" width="160" height="40" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="360" y="745" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">回复率/退信率/退订率</text>
  
  <!-- Dashboard -->
  <rect x="480" y="720" width="140" height="40" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="550" y="745" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">HTML 仪表盘</text>
  
  <!-- Connecting arrows between phases -->
  <path d="M340 240 L340 260" fill="none" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340 380 L340 400" fill="none" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340 520 L340 540" fill="none" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340 660 L340 680" fill="none" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Legend -->
  <rect x="500" y="30" width="160" height="80" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="510" y="50" font-size="12" font-weight="500" fill="#444441">图例</text>
  <rect x="510" y="60" width="12" height="12" rx="2" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
  <text x="530" y="70" font-size="11" fill="#5F5E5A">自动阶段</text>
  <rect x="510" y="80" width="12" height="12" rx="2" fill="#C0DD97" stroke="#639922" stroke-width="0.5"/>
  <text x="530" y="90" font-size="11" fill="#5F5E5A">人工审核</text>
</svg>