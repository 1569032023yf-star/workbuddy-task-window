<svg viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" font-size="16" font-weight="500" fill="#2C2C2A">线索状态流转图</text>
  
  <!-- Status nodes -->
  <!-- New -->
  <rect x="40" y="60" width="120" height="50" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="100" y="85" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">new</text>
  <text x="100" y="100" text-anchor="middle" font-size="11" fill="#185FA5">自动采集入库</text>
  
  <!-- Reviewed -->
  <rect x="200" y="60" width="120" height="50" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text x="260" y="85" text-anchor="middle" font-size="13" font-weight="500" fill="#27500A">reviewed</text>
  <text x="260" y="100" text-anchor="middle" font-size="11" fill="#3B6D11">人工审核通过</text>
  
  <!-- Drafted -->
  <rect x="360" y="60" width="120" height="50" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="420" y="85" text-anchor="middle" font-size="13" font-weight="500" fill="#633806">drafted</text>
  <text x="420" y="100" text-anchor="middle" font-size="11" fill="#854F0B">邮件已起草</text>
  
  <!-- Approved -->
  <rect x="520" y="60" width="120" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="580" y="85" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">approved</text>
  <text x="580" y="100" text-anchor="middle" font-size="11" fill="#534AB7">批准发送</text>
  
  <!-- Queued -->
  <rect x="40" y="160" width="120" height="50" rx="8" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
  <text x="100" y="185" text-anchor="middle" font-size="13" font-weight="500" fill="#72243E">queued</text>
  <text x="100" y="200" text-anchor="middle" font-size="11" fill="#993556">进入发送队列</text>
  
  <!-- Sent -->
  <rect x="200" y="160" width="120" height="50" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="260" y="185" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">sent</text>
  <text x="260" y="200" text-anchor="middle" font-size="11" fill="#0F6E56">已发送</text>
  
  <!-- Replied -->
  <rect x="360" y="160" width="120" height="50" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text x="420" y="185" text-anchor="middle" font-size="13" font-weight="500" fill="#27500A">replied</text>
  <text x="420" y="200" text-anchor="middle" font-size="11" fill="#3B6D11">已回复</text>
  
  <!-- Bounced -->
  <rect x="520" y="160" width="120" height="50" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
  <text x="580" y="185" text-anchor="middle" font-size="13" font-weight="500" fill="#791F1F">bounced</text>
  <text x="580" y="200" text-anchor="middle" font-size="11" fill="#A32D2D">退信</text>
  
  <!-- Unsubscribed -->
  <rect x="40" y="260" width="120" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="100" y="285" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">unsubscribed</text>
  <text x="100" y="300" text-anchor="middle" font-size="11" fill="#5F5E5A">退订</text>
  
  <!-- Do Not Contact -->
  <rect x="200" y="260" width="120" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="260" y="285" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">do_not_contact</text>
  <text x="260" y="300" text-anchor="middle" font-size="11" fill="#5F5E5A">禁止联系</text>
  
  <!-- Failed -->
  <rect x="360" y="260" width="120" height="50" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
  <text x="420" y="285" text-anchor="middle" font-size="13" font-weight="500" fill="#791F1F">failed</text>
  <text x="420" y="300" text-anchor="middle" font-size="11" fill="#A32D2D">发送失败</text>
  
  <!-- Suppression List -->
  <rect x="520" y="260" width="120" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="580" y="285" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">suppression</text>
  <text x="580" y="300" text-anchor="middle" font-size="11" fill="#5F5E5A">屏蔽名单</text>
  
  <!-- Arrows -->
  <!-- Auto flow -->
  <path d="M160 85 L200 85" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M320 85 L360 85" fill="none" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M480 85 L520 85" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Send flow -->
  <path d="M580 110 L580 160" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M520 185 L400 185" fill="none" stroke="#D4537E" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340 185 L260 185" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Response flows -->
  <path d="M320 185 L360 185" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M320 185 L520 185" fill="none" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Unsubscribe flows -->
  <path d="M420 210 L420 260" fill="none" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M260 210 L260 260" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M100 210 L100 260" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Suppression flows -->
  <path d="M320 285 L520 285" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M160 285 L200 285" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Retry flow -->
  <path d="M420 310 L420 340 Q420 360 400 360 L200 360 Q180 360 180 340 L180 210" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="300" y="375" text-anchor="middle" font-size="11" fill="#854F0B">重试（人工干预）</text>
  
  <!-- Legend -->
  <rect x="40" y="400" width="600" height="80" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="60" y="425" font-size="12" font-weight="500" fill="#444441">状态说明</text>
  <text x="60" y="445" font-size="11" fill="#5F5E5A">• new → reviewed → drafted → approved → queued → sent：正常发送流程</text>
  <text x="60" y="460" font-size="11" fill="#5F5E5A">• sent → replied：收到回复，停止跟进</text>
  <text x="60" y="475" font-size="11" fill="#5F5E5A">• sent → bounced/unsubscribed/do_not_contact：加入 suppression list，永不重发</text>
</svg>